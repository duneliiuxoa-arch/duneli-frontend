<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ── SEO ── -->
    <title>Duneli — Live Debate Platform</title>
    <meta name="description" content="Join real-time intellectual debates and discussions on Duneli. Speak, listen, and shape opinions live." />
    <meta name="keywords" content="debate, live discussion, intellectual, opinions, duneli" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://duneli.vercel.app" />

    <!-- ── Open Graph ── -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://duneli.vercel.app" />
    <meta property="og:title"       content="Duneli — Live Debate Platform" />
    <meta property="og:description" content="Join real-time intellectual debates on Duneli." />
    <meta property="og:image"       content="https://duneli.vercel.app/og-image.png" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Duneli — Live Debate Platform" />
    <meta name="twitter:description" content="Join real-time intellectual debates on Duneli." />

    <!-- ── Security ── -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- ── Performance ── -->
    <link rel="preconnect" href="https://piuujfqevenldrratobl.supabase.co" />
    <link rel="dns-prefetch" href="https://piuujfqevenldrratobl.supabase.co" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#6366f1" />

    <!-- ── Global Absolute Selection & Copy Protection ── -->
    <style>
      *, *::before, *::after {
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
        -webkit-user-drag: none !important;
        -webkit-touch-callout: none !important;
      }
      ::selection {
        background: transparent !important;
        color: inherit !important;
      }
      ::-moz-selection {
        background: transparent !important;
        color: inherit !important;
      }
      input, textarea, [contenteditable="true"] {
        -webkit-user-select: text !important;
        -moz-user-select: text !important;
        -ms-user-select: text !important;
        user-select: text !important;
      }
      input::selection, textarea::selection {
        background: #3b82f6 !important;
        color: #ffffff !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
